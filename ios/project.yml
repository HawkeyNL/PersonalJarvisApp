name: Jarvis
options:
  bundleIdPrefix: com.hawkeynl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawkeynl.jarvis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.10"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Jarvis/Info.plist
  JarvisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JarvisTests
    dependencies:
      - target: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawkeynl.jarvis.tests
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisTests: [test]
    test:
      targets:
        - JarvisTests
