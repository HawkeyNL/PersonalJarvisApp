name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Checked-in desktop version (MAJOR.MINOR.PATCH)
        required: true
        type: string

concurrency:
  group: application-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'HawkeyNL/PersonalJarvisApp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      released_at: ${{ steps.identity.outputs.released_at }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: identity
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 update-release/desktop_release.py --version "$APP_VERSION"
          python3 scripts/check-deployment-privacy.py
          # A failing API request is not proof that a tag/release is absent.
          gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name' > "$RUNNER_TEMP/tags"
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/releases"
          if grep -Fxq "app-v$APP_VERSION" "$RUNNER_TEMP/tags" ||
             grep -Fxq "app-v$APP_VERSION" "$RUNNER_TEMP/releases"; then
            echo "Application tag/release already exists" >&2
            exit 1
          fi
          echo "release_tag=app-v$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "released_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  desktop:
    name: Signed desktop — ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2022
            platform: windows
            architecture: x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS arm64
            os: macos-15
            platform: macos
            architecture: arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            platform: linux
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: application-release
    env:
      APP_VERSION: ${{ inputs.version }}
      JARVIS_TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      TAURI_RELEASE_CONFIG: '{"build":{"beforeBuildCommand":""}}'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Ubuntu packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Verify public release configuration
        shell: bash
        run: |
          test -n "$JARVIS_TAURI_UPDATER_PUBKEY" || { echo "TAURI_SIGNING_PUBLIC_KEY is required" >&2; exit 2; }
      - name: Install pinned dependencies and build unprivileged frontend
        working-directory: .
        shell: bash
        run: |
          npm ci
          npm run build
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target "${{ matrix.target }}"
      - name: Install ephemeral macOS Developer ID material
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_PRIVATE_KEY_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          for value in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_API_ISSUER_ID MACOS_NOTARY_API_KEY_ID MACOS_NOTARY_API_PRIVATE_KEY_BASE64 MACOS_SIGNING_IDENTITY; do
            test -n "${!value}" || { echo "$value is required" >&2; exit 2; }
          done
          keychain="$RUNNER_TEMP/jarvis-macos-release.keychain-db"
          keychain_password=$(uuidgen)
          certificate="$RUNNER_TEMP/jarvis-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$MACOS_NOTARY_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key"
          chmod 600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -Fq "$MACOS_SIGNING_IDENTITY"
          echo "JARVIS_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
      - name: Build signed updater and installer
        if: matrix.platform != 'macos'
        working-directory: .
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run desktop:build --
          --config "$TAURI_RELEASE_CONFIG"
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --ci
          --
          --locked
      - name: Build Developer ID signed and notarized macOS release
        if: matrix.platform == 'macos'
        working-directory: .
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run desktop:build --
          --config "$TAURI_RELEASE_CONFIG"
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --ci
          --
          --locked
      - name: Notarize and staple macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
        run: |
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test -n "$dmg" && test "$(printf '%s\n' "$dmg" | wc -l)" -eq 1 || { echo "expected exactly one macOS DMG" >&2; exit 2; }
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$MACOS_NOTARY_API_KEY_ID" \
            --issuer "$MACOS_NOTARY_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
      - name: Verify macOS OS trust and stapled notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app')
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test -n "$app" && test "$(printf '%s\n' "$app" | wc -l)" -eq 1 || { echo "expected exactly one macOS app bundle" >&2; exit 2; }
          test -n "$dmg" && test "$(printf '%s\n' "$dmg" | wc -l)" -eq 1 || { echo "expected exactly one macOS DMG" >&2; exit 2; }
          codesign --verify --deep --strict --verbose=2 "$app"
          signing_details=$(codesign -d --verbose=4 "$app" 2>&1)
          grep -Fq 'Authority=Developer ID Application:' <<< "$signing_details"
          grep -Eq 'flags=.*runtime' <<< "$signing_details"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - name: Collect canonical desktop assets
        shell: bash
        run: |
          python3 update-release/collect_tauri.py \
            --bundle-root "src-tauri/target/${{ matrix.target }}/release/bundle" \
            --output "$RUNNER_TEMP/desktop-assets" \
            --platform "${{ matrix.platform }}" \
            --version "$APP_VERSION"
      - name: Verify staged updater signatures against the embedded public key
        working-directory: .
        shell: bash
        run: |
          for signature in "$RUNNER_TEMP/desktop-assets"/*.sig; do
            artifact="${signature%.sig}"
            cargo run \
              --manifest-path src-tauri/Cargo.toml \
              --locked \
              --quiet \
              --example verify_update_signature \
              -- "$artifact" "$signature"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove ephemeral macOS signing material
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/jarvis-macos-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/jarvis-developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    needs: [validate, desktop]
    runs-on: ubuntu-24.04
    environment: application-release
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      RELEASED_AT: ${{ needs.validate.outputs.released_at }}
      SOURCE_REVISION: ${{ github.sha }}
      JARVIS_TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: desktop-*-${{ github.sha }}
          path: staged
          merge-multiple: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          npm ci
      - name: Validate matrix, signatures and manifest
        run: |
          python3 update-release/desktop_release.py --assets staged --version "$APP_VERSION" \
            --revision "$SOURCE_REVISION" --released-at "$RELEASED_AT" --output latest.json
          python3 update-release/signatures.py staged
          python3 scripts/check-deployment-privacy.py --artifact latest.json
          for artifact in staged/*; do
            python3 scripts/check-deployment-privacy.py --artifact "$artifact"
          done
      - name: Sign release metadata
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- signer sign latest.json
      - name: Publish only a completely revalidated draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 update-release/signatures.py latest.json
          gh release create "$RELEASE_TAG" --draft --target "$SOURCE_REVISION" \
            --title "Jarvis $APP_VERSION" --notes "Desktop release. Source revision: $SOURCE_REVISION"
          gh release upload "$RELEASE_TAG" staged/* latest.json latest.json.sig
          mkdir final
          gh release download "$RELEASE_TAG" --dir final
          python3 update-release/verify_published.py final staged latest.json "$APP_VERSION" "$SOURCE_REVISION"
          python3 update-release/signatures.py final
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json
          python3 -c 'import json,os; r=json.load(open("release-state.json")); assert r["isDraft"] is True; assert r["targetCommitish"] == os.environ["SOURCE_REVISION"]'
          gh release edit "$RELEASE_TAG" --draft=false --latest
