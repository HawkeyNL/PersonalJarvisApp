name: Unified Jarvis client release

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Checked-in client SemVer (MAJOR.MINOR.PATCH)
        required: true
        type: string
      android_version_code:
        description: Monotonically increasing Android versionCode
        required: true
        type: string

concurrency:
  group: application-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'HawkeyNL/PersonalJarvisApp' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')))
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      released_at: ${{ steps.identity.outputs.released_at }}
      app_version: ${{ steps.identity.outputs.app_version }}
      android_version_code: ${{ steps.identity.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: identity
        env:
          APP_VERSION: ${{ inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reject tags pointing outside reviewed main before invoking release
          # tooling or granting any downstream job signing credentials.
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release source must be reachable from main" >&2
            exit 2
          }
          python3 update-release/release_identity.py \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --version "$APP_VERSION" --android-version-code "$ANDROID_VERSION_CODE" > identity.json
          APP_VERSION=$(jq -er .app_version identity.json)
          ANDROID_VERSION_CODE=$(jq -er .android_version_code identity.json)
          [[ "$ANDROID_SIGNING_CERTIFICATE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "ANDROID_SIGNING_CERTIFICATE_SHA256 must be a lowercase SHA-256 digest" >&2
            exit 2
          }
          python3 update-release/client_release.py --version "$APP_VERSION" \
            --android-version-code "$ANDROID_VERSION_CODE"
          python3 scripts/check-deployment-privacy.py
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "app-v$APP_VERSION"
            test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          fi
          # Private publication validates prior signed metadata, monotonic
          # Android build identity and immutable app-v tags in GHCR.
          echo "release_tag=app-v$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "released_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  desktop:
    name: Signed desktop — ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2022
            platform: windows
            architecture: x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS arm64
            os: macos-15
            platform: macos
            architecture: arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            platform: linux
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: application-release
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      JARVIS_TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      TAURI_RELEASE_CONFIG: '{"build":{"beforeBuildCommand":""}}'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Ubuntu packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Verify public release configuration
        shell: bash
        run: |
          test -n "$JARVIS_TAURI_UPDATER_PUBKEY" || { echo "TAURI_SIGNING_PUBLIC_KEY is required" >&2; exit 2; }
      - name: Install pinned dependencies and build unprivileged frontend
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm run build
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target "${{ matrix.target }}"
      - name: Install ephemeral macOS Developer ID material
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_PRIVATE_KEY_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          for value in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_API_ISSUER_ID MACOS_NOTARY_API_KEY_ID MACOS_NOTARY_API_PRIVATE_KEY_BASE64 MACOS_SIGNING_IDENTITY; do
            test -n "${!value}" || { echo "$value is required" >&2; exit 2; }
          done
          keychain="$RUNNER_TEMP/jarvis-macos-release.keychain-db"
          keychain_password=$(uuidgen)
          certificate="$RUNNER_TEMP/jarvis-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$MACOS_NOTARY_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key"
          chmod 600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -Fq "$MACOS_SIGNING_IDENTITY"
          echo "JARVIS_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
      - name: Build signed updater and installer
        if: matrix.platform != 'macos'
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run desktop:build --
          --config "$TAURI_RELEASE_CONFIG"
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --ci
          --
          --locked
      - name: Build Developer ID signed and notarized macOS release
        if: matrix.platform == 'macos'
        working-directory: desktop
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run desktop:build --
          --config "$TAURI_RELEASE_CONFIG"
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --ci
          --
          --locked
      - name: Notarize and staple macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
        run: |
          dmg=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test -n "$dmg" && test "$(printf '%s\n' "$dmg" | wc -l)" -eq 1 || { echo "expected exactly one macOS DMG" >&2; exit 2; }
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$MACOS_NOTARY_API_KEY_ID" \
            --issuer "$MACOS_NOTARY_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
      - name: Verify macOS OS trust and stapled notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app')
          dmg=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test -n "$app" && test "$(printf '%s\n' "$app" | wc -l)" -eq 1 || { echo "expected exactly one macOS app bundle" >&2; exit 2; }
          test -n "$dmg" && test "$(printf '%s\n' "$dmg" | wc -l)" -eq 1 || { echo "expected exactly one macOS DMG" >&2; exit 2; }
          codesign --verify --deep --strict --verbose=2 "$app"
          signing_details=$(codesign -d --verbose=4 "$app" 2>&1)
          grep -Fq 'Authority=Developer ID Application:' <<< "$signing_details"
          grep -Eq 'flags=.*runtime' <<< "$signing_details"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - name: Collect canonical desktop assets
        shell: bash
        run: |
          python3 update-release/collect_tauri.py \
            --bundle-root "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" \
            --output "$RUNNER_TEMP/desktop-assets" \
            --platform "${{ matrix.platform }}" \
            --version "$APP_VERSION"
      - name: Verify staged updater signatures against the embedded public key
        working-directory: desktop
        shell: bash
        run: |
          for signature in "$RUNNER_TEMP/desktop-assets"/*.sig; do
            artifact="${signature%.sig}"
            cargo run \
              --manifest-path src-tauri/Cargo.toml \
              --locked \
              --quiet \
              --example verify_update_signature \
              -- "$artifact" "$signature"
          done
      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20 # v1.2.3
        with:
          version: 1.2.3
      - name: Transfer exact desktop bytes through private GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update-release/private_registry.py push-part --directory "$RUNNER_TEMP/desktop-assets" --version "$APP_VERSION" --target "${{ matrix.platform }}"
      - name: Remove ephemeral macOS signing material
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/jarvis-macos-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/jarvis-developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  android:
    name: Signed Android APK and AAB
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: application-release
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      JARVIS_ANDROID_VERSION_CODE: ${{ needs.validate.outputs.android_version_code }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/build.gradle.kts
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Materialize ephemeral release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          JARVIS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          JARVIS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          JARVIS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "ANDROID_RELEASE_KEYSTORE_BASE64 is required" >&2; exit 2; }
          test -n "$JARVIS_ANDROID_KEY_ALIAS" || { echo "ANDROID_RELEASE_KEY_ALIAS is required" >&2; exit 2; }
          test -n "$JARVIS_ANDROID_KEY_PASSWORD" || { echo "ANDROID_RELEASE_KEY_PASSWORD is required" >&2; exit 2; }
          test -n "$JARVIS_ANDROID_STORE_PASSWORD" || { echo "ANDROID_RELEASE_STORE_PASSWORD is required" >&2; exit 2; }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-release.jks"
          echo "JARVIS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
      - name: Test, lint and build signed release packages
        env:
          JARVIS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          JARVIS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          JARVIS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease bundleRelease --no-daemon
      - name: Verify and collect signed Android packages
        env:
          EXPECTED_ANDROID_SIGNER: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*')
          test -n "$apk" && test "$(printf '%s\n' "$apk" | wc -l)" -eq 1 || { echo "expected exactly one signed release APK" >&2; exit 2; }
          aab=$(find app/build/outputs/bundle/release -type f -name '*.aab')
          test -n "$aab" && test "$(printf '%s\n' "$aab" | wc -l)" -eq 1 || { echo "expected exactly one signed release AAB" >&2; exit 2; }
          apksigner verify --verbose "$apk"
          fingerprint=$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo "APK signing certificate digest is unavailable" >&2; exit 2; }
          test "$fingerprint" = "$EXPECTED_ANDROID_SIGNER" || { echo "APK signer does not match the pinned release identity" >&2; exit 2; }
          mkdir -p "$RUNNER_TEMP/android-assets"
          cp "$apk" "$RUNNER_TEMP/android-assets/Jarvis_${APP_VERSION}_android_universal.apk"
          cp "$aab" "$RUNNER_TEMP/android-assets/Jarvis_${APP_VERSION}_android_universal.aab"
      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20 # v1.2.3
        with:
          version: 1.2.3
      - name: Transfer exact Android bytes through private GHCR
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update-release/private_registry.py push-part --directory "$RUNNER_TEMP/android-assets" --version "$APP_VERSION" --target android
      - name: Remove ephemeral Android keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-release.jks"

  ios-sideload:
    name: Unsigned iPhone installer for local owner signing
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    environment: application-release
    permissions:
      contents: read
      packages: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build physical iPhone payload without signing credentials
        run: |
          xcodebuild -project ios/Jarvis.xcodeproj -scheme Jarvis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/JarvisDevice" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          python3 update-release/ios_sideload.py \
            --app "$RUNNER_TEMP/JarvisDevice/Build/Products/Release-iphoneos/Jarvis.app" \
            --output "$RUNNER_TEMP/ios-candidate" --version "$APP_VERSION" --revision "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/ios-assets"
          cp "$RUNNER_TEMP/ios-candidate/Jarvis_${APP_VERSION}_ios_arm64_unsigned.ipa" "$RUNNER_TEMP/ios-assets/"
      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20 # v1.2.3
        with:
          version: 1.2.3
      - name: Transfer unsigned iPhone payload privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update-release/private_registry.py push-part --directory "$RUNNER_TEMP/ios-assets" --version "$APP_VERSION" --target ios

  publish:
    needs: [validate, desktop, android, ios-sideload]
    runs-on: ubuntu-24.04
    environment: application-release
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      RELEASED_AT: ${{ needs.validate.outputs.released_at }}
      SOURCE_REVISION: ${{ github.sha }}
      JARVIS_TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
      ANDROID_VERSION_CODE: ${{ needs.validate.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20 # v1.2.3
        with:
          version: 1.2.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Collect private platform builds from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update-release/private_registry.py pull-parts --directory staged --version "$APP_VERSION"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - working-directory: desktop
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          npm ci
      - name: Validate matrix, signatures and manifest
        run: |
          python3 update-release/client_release.py --assets staged --version "$APP_VERSION" \
            --revision "$SOURCE_REVISION" --released-at "$RELEASED_AT" \
            --android-version-code "$ANDROID_VERSION_CODE" \
            --android-signer "$ANDROID_SIGNING_CERTIFICATE_SHA256" \
            --output latest.json
          python3 update-release/signatures.py staged
          python3 scripts/check-deployment-privacy.py --artifact latest.json
          for artifact in staged/*; do
            python3 scripts/check-deployment-privacy.py --artifact "$artifact"
          done
      - name: Sign release metadata
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: desktop
        run: npm run tauri -- signer sign ../latest.json
      - name: Publish complete signed release only to private GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 update-release/signatures.py latest.json
          cp latest.json latest.json.sig staged/
          python3 update-release/private_registry.py publish --directory staged --version "$APP_VERSION"
